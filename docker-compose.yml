# ─────────────────────────────────────────────────
# Samosbor AI Game v2 — Docker Compose
# ─────────────────────────────────────────────────

x-shared: &shared
  env_file: .env
  restart: unless-stopped

services:

  # ── Балансировщик + Rate Limiting ──────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot
    restart: unless-stopped

  # ── Telegram Bot (FastAPI) ─────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  # ── Temporal Server (оркестратор) ──────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_DB_USER}
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=${TEMPORAL_DB_HOST}
      - DBNAME=${TEMPORAL_DB_NAME}
      - VISIBILITY_DBNAME=${TEMPORAL_DB_NAME}_visibility
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamic.yaml
    volumes:
      - ./temporal-dynamic.yaml:/etc/temporal/config/dynamic.yaml
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: unless-stopped

  temporal-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${TEMPORAL_DB_USER}
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_DB=${TEMPORAL_DB_NAME}
    volumes:
      - ./data/temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER} -d ${TEMPORAL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── PostgreSQL + pgvector (основная БД) ────────
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (кеш, volatile) ──────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save ""
      --appendonly no
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Langfuse (мониторинг LLM) ──────────────────
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/samosbor_langfuse
      - NEXTAUTH_SECRET=changeme-langfuse-secret
      - SALT=changeme-langfuse-salt
      - TELEMETRY_ENABLED=false
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Ollama (эмбединги, только для RAG) ───────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    profiles:
      - rag
    restart: "no"
