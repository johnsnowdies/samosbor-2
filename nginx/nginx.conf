events {
    worker_connections 1024;
}

http {
    # ── Rate Limiting ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=game_limit:10m rate=10r/s;

    # ── Upstreams ─────────────────────────────────────
    upstream bot {
        server bot:8000 max_fails=3 fail_timeout=30s;
    }

    # ── Server ────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Webhook (Telegram → Bot) ────────────────
        location /webhook {
            limit_req zone=game_limit burst=5 nodelay;
            proxy_pass http://bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Health Check ────────────────────────────
        location /health {
            proxy_pass http://bot;
            proxy_set_header Host $host;
        }

        # ── Metrics ─────────────────────────────────
        location /metrics {
            proxy_pass http://bot;
            proxy_set_header Host $host;
        }

        # ── Статика (документы, TOS, Privacy) ──────
        location /static/ {
            alias /app/static/;
        }

        # ── Deny all other routes ──────────────────
        location / {
            return 404;
        }
    }
}